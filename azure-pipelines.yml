trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/**

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - qa
      - prod

  - name: terraformAction
    displayName: 'Terraform Action'
    type: string
    default: 'apply'
    values:
      - apply
      - plan-only
      - destroy

pool:
  name: 'SelfHostedPool'

variables:
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)'
  - name: serviceConnection
    value: 'azure-service-connection'
  - name: TF_IN_AUTOMATION
    value: 'true'

stages:
  # =========================================================================
  # Stage 1: Security Scanning & Linting Gates
  # =========================================================================
  - stage: Security_Scanning
    displayName: 'IaC Security & Linting'
    jobs:
      - job: IaCSecurityScan
        displayName: 'Run Security Scanners'
        steps:
          - checkout: self
            clean: all
            fetchDepth: 0

          - script: |
              echo "==> Commit Details:"
              git log -1 --oneline
              echo "==> Validating Terraform Format"
              terraform fmt -check -recursive
            displayName: 'Verify Code & Format'

          - script: |
              cd $(workingDirectory)
              tflint --init || true
              tflint --recursive || true
            displayName: 'Run TFLint'
            continueOnError: true

          - script: |
              checkov -d $(workingDirectory) \
                --framework terraform \
                --soft-fail \
                --output cli
            displayName: 'Run Checkov IaC Scan'

          - script: |
              trivy config $(workingDirectory) --exit-code 0 --severity HIGH,CRITICAL
            displayName: 'Run Trivy Config Scan'

          - script: |
              gitleaks detect --source=$(workingDirectory) --verbose || true
            displayName: 'Detect Hardcoded Secrets (Gitleaks)'

  # =========================================================================
  # Stage 2: Terraform Plan (Runs for apply and plan-only)
  # =========================================================================
  - stage: Terraform_Plan
    displayName: 'Terraform Plan & Validate'
    dependsOn: Security_Scanning
    condition: and(succeeded(), ne('${{ parameters.terraformAction }}', 'destroy'))
    jobs:
      - job: PlanJob
        displayName: 'Plan (${{ parameters.environment }})'
        steps:
          - checkout: self
            clean: all

          - task: AzureCLI@2
            displayName: 'Execute lab.sh plan'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(workingDirectory)
              inlineScript: |
                chmod +x scripts/*.sh
                ./scripts/lab.sh plan ${{ parameters.environment }}

          - task: PublishPipelineArtifact@1
            displayName: 'Publish tfplan Artifact'
            inputs:
              targetPath: '$(workingDirectory)/tfplan-${{ parameters.environment }}'
              artifact: 'tfplan-${{ parameters.environment }}'
              publishLocation: 'pipeline'

  # =========================================================================
  # Stage 3: Terraform Apply (Pauses for Manual Approval)
  # =========================================================================
  - stage: Terraform_Apply
    displayName: 'Terraform Apply'
    dependsOn: Terraform_Plan
    condition: and(succeeded(), eq('${{ parameters.terraformAction }}', 'apply'))
    jobs:
      - deployment: ApplyDeployment
        displayName: 'Apply (${{ parameters.environment }})'
        environment: '${{ parameters.environment }}-approval'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: all

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download tfplan Artifact'
                  inputs:
                    buildType: 'current'
                    artifactName: 'tfplan-${{ parameters.environment }}'
                    targetPath: '$(Pipeline.Workspace)/downloaded_plan'

                - script: |
                    cp $(Pipeline.Workspace)/downloaded_plan/tfplan-${{ parameters.environment }} $(workingDirectory)/
                    ls -la $(workingDirectory)/tfplan-${{ parameters.environment }}
                  displayName: 'Stage tfplan in Working Directory'

                - task: AzureCLI@2
                  displayName: 'Execute lab.sh apply'
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: $(workingDirectory)
                    inlineScript: |
                      chmod +x scripts/*.sh
                      ./scripts/lab.sh apply ${{ parameters.environment }}

  # =========================================================================
  # Stage 4: Terraform Destroy
  # =========================================================================
  - stage: Terraform_Destroy
    displayName: 'Terraform Destroy'
    dependsOn: Security_Scanning
    condition: and(succeeded(), eq('${{ parameters.terraformAction }}', 'destroy'))
    jobs:
      - deployment: DestroyDeployment
        displayName: 'Destroy (${{ parameters.environment }})'
        environment: '${{ parameters.environment }}-destroy-approval'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: all

                - task: AzureCLI@2
                  displayName: 'Execute lab.sh destroy'
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: $(workingDirectory)
                    inlineScript: |
                      chmod +x scripts/*.sh
                      ./scripts/lab.sh destroy ${{ parameters.environment }}