apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend

  namespace: frontend

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  strategy:
    type: RollingUpdate

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

      - name: frontend

        image: mahi271/frontend-app:v3

        imagePullPolicy: Always

        ports:

        - containerPort: 80

        envFrom:

        - configMapRef:
            name: frontend-config

        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:

          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 5

        livenessProbe:

          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 15