apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

  namespace: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  strategy:
    type: RollingUpdate

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend

        image: mahi271/backend-api:v2

        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        envFrom:

        - configMapRef:
            name: backend-config

        - secretRef:
            name: backend-secret

        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:

          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:

          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 15
          periodSeconds: 20